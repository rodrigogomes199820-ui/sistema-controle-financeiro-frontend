<mat-toolbar class="navbar">
  <button
    *ngIf="mobileMode"
    class="menu-toggle"
    mat-icon-button
    type="button"
    [attr.aria-expanded]="mobileMenuOpen"
    [attr.aria-label]="mobileMenuOpen ? 'Fechar menu de navegação' : 'Abrir menu de navegação'"
    (click)="alternarMenuMobile()">
    <mat-icon aria-hidden="true">{{ mobileMenuOpen ? 'close' : 'menu' }}</mat-icon>
  </button>

  <a class="brand" routerLink="/layout/dashboard" aria-label="FinanceFlow - início">
    <mat-icon class="brand-icon">account_balance_wallet</mat-icon>
    <span>Rog<span class="brand-highlight">Fin</span></span>
  </a>

  <span class="spacer"></span>

  <button mat-icon-button type="button" class="notification-button" aria-label="Notificações">
    <mat-icon aria-hidden="true">notifications_none</mat-icon>
  </button>

  <button mat-button type="button" class="logout-button" (click)="sair()">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<div class="layout-content" [class.mobile-menu-open]="mobileMode && mobileMenuOpen">
  <app-sidebar
    [mobileMode]="mobileMode"
    [mobileExpanded]="mobileMenuOpen"
    (navigationSelected)="fecharMenuMobile()">
  </app-sidebar>
  <button
    *ngIf="mobileMode && mobileMenuOpen"
    class="mobile-menu-backdrop"
    type="button"
    aria-label="Fechar menu de navegação"
    (click)="fecharMenuMobile()">
  </button>
  <main class="page-content">
    <router-outlet></router-outlet>
  </main>
</div>
