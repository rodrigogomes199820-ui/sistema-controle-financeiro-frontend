<mat-toolbar class="navbar">
  <a class="brand" routerLink="/layout" aria-label="FinanceFlow - início">
    <mat-icon class="brand-icon">account_balance_wallet</mat-icon>
    <span>Rog<span class="brand-highlight">Fin</span></span>
  </a>

  <span class="spacer"></span>

  <ng-container *ngIf="nomeUsuario">
    <span class="user-greeting">Olá, {{nomeUsuario}} 

    </span>
  </ng-container>

  <button mat-icon-button type="button" class="notification-button" aria-label="Notificações">
    <mat-icon aria-hidden="true">notifications_none</mat-icon>
  </button>

  <button mat-button type="button" class="logout-button" (click)="sair()">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>

<app-sidebar></app-sidebar>
